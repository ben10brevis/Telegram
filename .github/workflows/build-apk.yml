name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Inject API credentials
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/APP_ID = [0-9]+;/APP_ID = ${TG_APP_ID};/" "$F"
          sed -i -E "s/APP_HASH = \"[^\"]*\";/APP_HASH = \"${TG_APP_HASH}\";/" "$F"

      # BLUR_SCALE: 0 = no blur, 1 = stock Telegram, 0.3 = light blur
      # TINT_SCALE: how opaque the glass fill is. 1 = stock, 0.6 = clear glass, 0.4 = very clear
      - name: Apply clear-glass patch (no blur, see-through glass)
        env:
          BLUR_SCALE: "0"
          TINT_SCALE: "0.6"
        run: |
          python3 - <<'PY'
          import os, re, sys

          SCALE = os.environ.get("BLUR_SCALE", "0")
          TINT = os.environ.get("TINT_SCALE", "0.6")
          root = "TMessagesProj/src/main/java/org/telegram"

          # 1) new helper
          tuning = """package org.telegram.utils.glass;

          import android.graphics.RenderEffect;
          import android.graphics.Shader;

          import androidx.annotation.Nullable;

          /** Global blur strength for all glass effects. 0 = no blur (clear glass), 1 = stock Telegram. */
          public class GlassTuning {
              public static final float BLUR_SCALE = __SCALE__f;

              public static final float TINT_SCALE = __TINT__f;

              public static float blur(float radius) {
                  return radius * BLUR_SCALE;
              }

              /** How opaque the glass fill is: 1 = stock Telegram, lower = more see-through. */
              public static float tint(float alpha) {
                  return Math.max(0f, Math.min(1f, alpha * TINT_SCALE));
              }

              @Nullable
              public static RenderEffect blurEffect(float radiusX, float radiusY) {
                  if (radiusX <= 0f && radiusY <= 0f) {
                      return null;
                  }
                  return RenderEffect.createBlurEffect(radiusX, radiusY, Shader.TileMode.CLAMP);
              }

              public static RenderEffect chain(@Nullable RenderEffect first, RenderEffect second) {
                  return first == null ? second : RenderEffect.createChainEffect(first, second);
              }
          }
          """.replace("__SCALE__", str(float(SCALE))).replace("__TINT__", str(float(TINT)))
          open(f"{root}/utils/glass/GlassTuning.java", "w").write(tuning)

          def sub(path, old, new, count=1):
              s = open(path).read()
              n = s.count(old)
              if n != count:
                  sys.exit(f"PATCH FAILED: {path}: expected {count} of {old!r}, found {n}")
              open(path, "w").write(s.replace(old, new))

          # 2) GlassCaptureSourceCanvas
          p = f"{root}/utils/glass/GlassCaptureSourceCanvas.java"
          sub(p, "blurRadiusForDownsample(dpf2(7), glassDownsample);",
                 "blurRadiusForDownsample(GlassTuning.blur(dpf2(7)), glassDownsample);")
          sub(p, "dpf2(36), frostedGlassDownsample);",
                 "GlassTuning.blur(dpf2(36)), frostedGlassDownsample);")
          sub(p, """renderNode.setRenderEffect(RenderEffect.createBlurEffect(
                                  glassRadius, glassRadius, Shader.TileMode.CLAMP));""",
                 "renderNode.setRenderEffect(GlassTuning.blurEffect(glassRadius, glassRadius));")
          sub(p, """renderNodeGlassFrosted.setRenderEffect(RenderEffect.createBlurEffect(
                                  frostedGlassRadius, frostedGlassRadius, Shader.TileMode.CLAMP));""",
                 "renderNodeGlassFrosted.setRenderEffect(GlassTuning.blurEffect(frostedGlassRadius, frostedGlassRadius));")
          sub(p, """renderNodeFrostedFiltered.setRenderEffect(RenderEffect.createBlurEffect(
                                  frostedGlassRadius, frostedGlassRadius, Shader.TileMode.CLAMP));""",
                 "renderNodeFrostedFiltered.setRenderEffect(GlassTuning.blurEffect(frostedGlassRadius, frostedGlassRadius));")

          # 3) DownscaleScrollableNoiseSuppressor
          p = f"{root}/ui/Components/blur3/DownscaleScrollableNoiseSuppressor.java"
          sub(p, """        public void setPrimaryEffectBlur(float radius) {
                      final float downsampledRadiusX = downscaleRadius(radius, scaleX);
                      final float downsampledRadiusY = downscaleRadius(radius, scaleY);
                      setPrimaryEffect(RenderEffect.createBlurEffect(
                          downsampledRadiusX,
                          downsampledRadiusY,
                          Shader.TileMode.CLAMP
                      ));
                  }""", """        public void setPrimaryEffectBlur(float radius) {
                      if (radius <= 0f) {
                          setPrimaryEffect(null);
                          return;
                      }
                      final float downsampledRadiusX = downscaleRadius(radius, scaleX);
                      final float downsampledRadiusY = downscaleRadius(radius, scaleY);
                      setPrimaryEffect(GlassTuning.blurEffect(downsampledRadiusX, downsampledRadiusY));
                  }""")
          sub(p, """        public void setPrimaryEffectBlur(float radius, RenderEffect secondEffect) {
                      final float downsampledRadiusX = downscaleRadius(radius, scaleX);
                      final float downsampledRadiusY = downscaleRadius(radius, scaleY);

                      setPrimaryEffect(RenderEffect.createChainEffect(RenderEffect.createBlurEffect(
                          downsampledRadiusX,
                          downsampledRadiusY,
                          Shader.TileMode.CLAMP
                      ), secondEffect));
                  }""", """        public void setPrimaryEffectBlur(float radius, RenderEffect secondEffect) {
                      if (radius <= 0f) {
                          setPrimaryEffect(secondEffect);
                          return;
                      }
                      final float downsampledRadiusX = downscaleRadius(radius, scaleX);
                      final float downsampledRadiusY = downscaleRadius(radius, scaleY);

                      setPrimaryEffect(GlassTuning.chain(GlassTuning.blurEffect(downsampledRadiusX, downsampledRadiusY), secondEffect));
                  }""")
          sub(p, "setPrimaryEffectBlur(dpf2(6f), RenderNodeEffects", "setPrimaryEffectBlur(GlassTuning.blur(dpf2(6f)), RenderNodeEffects")
          sub(p, "setPrimaryEffectBlur(dpf2(6f));", "setPrimaryEffectBlur(GlassTuning.blur(dpf2(6f)));")
          sub(p, "setPrimaryEffectBlur(dpf2(40 - 1.66f));", "setPrimaryEffectBlur(GlassTuning.blur(dpf2(40 - 1.66f)));")
          sub(p, "setPrimaryEffectBlur(dpf2(40), RenderNodeEffects", "setPrimaryEffectBlur(GlassTuning.blur(dpf2(40)), RenderNodeEffects")
          sub(p, "setPrimaryEffectBlur(dpf2(40));", "setPrimaryEffectBlur(GlassTuning.blur(dpf2(40)));")
          sub(p, "import static org.telegram.messenger.AndroidUtilities.dpf2;",
                 "import static org.telegram.messenger.AndroidUtilities.dpf2;\n\nimport org.telegram.utils.glass.GlassTuning;")

          # 4) GlassSourceRenderNode.setBlur (other users of glass sources)
          p = f"{root}/utils/glass/source/GlassSourceRenderNode.java"
          sub(p, "renderNode.setRenderEffect(radius > 0 ? RenderEffect.createBlurEffect(radius, radius, Shader.TileMode.CLAMP) : null);",
                 "radius = org.telegram.utils.glass.GlassTuning.blur(radius);\n        renderNode.setRenderEffect(radius > 0 ? RenderEffect.createBlurEffect(radius, radius, Shader.TileMode.CLAMP) : null);")
          sub(p, "renderNode.setRenderEffect(RenderEffect.createChainEffect(RenderEffect.createBlurEffect(radius, radius, Shader.TileMode.CLAMP), effect));",
                 "radius = org.telegram.utils.glass.GlassTuning.blur(radius);\n        renderNode.setRenderEffect(org.telegram.utils.glass.GlassTuning.chain(org.telegram.utils.glass.GlassTuning.blurEffect(radius, radius), effect));")

          # 5) glass fill transparency (tab bar, header, menus, popups)
          p = f"{root}/ui/Components/blur3/drawable/color/impl/BlurredBackgroundProviderImpl.java"
          src = open(p).read()
          src, n1 = re.subn(r"(LiteMode\.isEnabled\(LiteMode\.FLAG_LIQUID_GLASS\) \? )([0-9.]+f)( : )([0-9.]+f)",
                            r"\1GlassTuning.tint(\2)\3GlassTuning.tint(\4)", src)
          src, n2 = re.subn(r"isDark \? 0\.85f : 0\.825f", "GlassTuning.tint(isDark ? 0.85f : 0.825f)", src)
          src = src.replace("Theme.multAlpha(Theme.getColor(Theme.key_windowBackgroundWhite, r), 0.88f)",
                            "Theme.multAlpha(Theme.getColor(Theme.key_windowBackgroundWhite, r), GlassTuning.tint(0.88f))")
          if n1 < 5 or n2 < 2:
              sys.exit(f"PATCH FAILED: tint patterns n1={n1} n2={n2}")
          src = src.replace("\n\n", "\n\nimport org.telegram.utils.glass.GlassTuning;\n", 1) if "import org.telegram.utils.glass.GlassTuning;" not in src else src
          open(p, "w").write(src)
          print("glass patch applied, BLUR_SCALE =", SCALE, "TINT_SCALE =", TINT, "tint sites:", n1, n2)
          PY

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clear-glass-telegram-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
